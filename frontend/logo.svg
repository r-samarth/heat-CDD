<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    
    <!-- Accent Gradient for Heat Reduction -->
    <linearGradient id="heatCoolGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shield Base with soft drop shadow -->
  <path d="M60 14 C82 14, 98 22, 102 36 C102 68, 82 96, 60 106 C38 96, 18 68, 18 36 C22 22, 38 14, 60 14 Z" 
        fill="url(#shieldGrad)" />
  
  <!-- Subtle inner shield rim -->
  <path d="M60 19 C79 19, 93 26, 96 38 C96 66, 79 91, 60 99 C41 91, 24 66, 24 38 C27 26, 41 19, 60 19 Z" 
        fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>

  <!-- City Skyline Silhouette inside Shield -->
  <!-- Building 1 Left -->
  <rect x="33" y="58" width="10" height="26" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <!-- Building 2 Mid-Left -->
  <rect x="45" y="48" width="11" height="36" rx="2" fill="#FFFFFF" fill-opacity="0.45"/>
  <!-- Building 3 Mid-Right -->
  <rect x="64" y="44" width="12" height="40" rx="2" fill="#FFFFFF" fill-opacity="0.45"/>
  <!-- Building 4 Far-Right -->
  <rect x="78" y="54" width="9" height="30" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- Windows Grid Details -->
  <circle cx="38" cy="65" r="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="38" cy="72" r="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="50" cy="56" r="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="50" cy="64" r="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="50" cy="72" r="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="70" cy="52" r="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="70" cy="60" r="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="70" cy="68" r="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="82" cy="62" r="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="82" cy="70" r="1" fill="#FFFFFF" fill-opacity="0.8"/>

  <!-- Central Precision Thermometer / Climate Sensor -->
  <!-- Stem Shadow/Backing -->
  <rect x="56" y="30" width="8" height="42" rx="4" fill="#0F172A" fill-opacity="0.35"/>
  <circle cx="60" cy="74" r="9" fill="#0F172A" fill-opacity="0.35"/>

  <!-- Thermometer Glass Tube (white) -->
  <rect x="57" y="31" width="6" height="40" rx="3" fill="#FFFFFF"/>
  <circle cx="60" cy="73" r="8" fill="#FFFFFF"/>

  <!-- Thermal Indicator Fluid Core -->
  <rect x="58.5" y="38" width="3" height="32" rx="1.5" fill="url(#heatCoolGrad)"/>
  <circle cx="60" cy="73" r="5.5" fill="#06B6D4"/>
  <circle cx="60" cy="73" r="2.5" fill="#FFFFFF" fill-opacity="0.7"/>

  <!-- Tick Marks -->
  <line x1="64.5" y1="36" x2="66.5" y2="36" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="64.5" y1="42" x2="67.5" y2="42" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="64.5" y1="48" x2="66.5" y2="48" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="64.5" y1="54" x2="67.5" y2="54" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Cooling Wave Ring -->
  <ellipse cx="60" cy="92" rx="14" ry="3.5" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.75" stroke-dasharray="2 3"/>
</svg>